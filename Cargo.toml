[workspace]
members = [".", "crates/bevy_fast_clouds", "crates/stealth-campaign", "crates/stealth-formats", "crates/stealth-host", "crates/stealth-master", "crates/stealth-master-proto", "crates/stealth-mission", "crates/stealth-net", "crates/stealth-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.8.3"

[workspace.dependencies]
stealth-formats = { path = "crates/stealth-formats" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"

[package]
name = "stealth-mission-89"
version.workspace = true
edition.workspace = true

[features]
default = ["dev", "xr"]
dev = ["bevy/dynamic_linking"]
# OpenXR support (`--vr`); the loader is opened at runtime, so builds without a runtime still work.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]
# `--gl-vr`: the headset drawn with our own OpenGL renderer (src/glvr), foveated on the Steam Frame.
glvr = ["xr", "dep:glow", "dep:khronos-egl", "dep:libloading"]
# The browser build on WebGPU (web/index.html); without it, on WebGL2 (web/gl/index.html).
webgpu = ["bevy/webgpu"]

[dependencies]
# trace: spans for every system and render node (timed with SM89_PROFILE, see src/profile.rs).
bevy = { version = "0.19.1", features = ["flac", "trace"] }
bevy_egui = "0.42"
# The cockpit tooltips' font (egui's Hack: Bevy's built-in font has no accented letters) and the
# check that it draws a key's label.
epaint_default_fonts = "0.36"
ttf-parser = "0.25"
serde.workspace = true
ron.workspace = true
serde_json = "1"
stealth-formats.workspace = true
stealth-mission = { path = "crates/stealth-mission" }
stealth-sim = { path = "crates/stealth-sim" }
stealth-campaign = { path = "crates/stealth-campaign" }
stealth-host = { path = "crates/stealth-host" }
stealth-net = { path = "crates/stealth-net" }
stealth-master-proto = { path = "crates/stealth-master-proto" }
bevy_fast_clouds = { path = "crates/bevy_fast_clouds" }
anyhow.workspace = true
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# GIF recording (src/gif_recorder.rs).
gif = "0.14"
png = "0.18"
gilrs = "0.11"
# SystemTime that works in the browser build too (std's panics there).
web-time = "1"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
openxr = { version = "0.21", optional = true }
glow = { version = "0.18", optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libloading = { version = "0.8", optional = true }

# The browser build: randomness from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }

# The Pictures folder for GIF recordings.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
# The coop radio's microphone (`voice/capture.rs`); already in the tree through bevy_audio.
cpal = "0.17"
# Spoken ATC (`src/tts`): Piper voices run in pure Rust (no ONNX Runtime, nothing to install);
# `random` because the VITS duration predictor samples noise, `mmap` keeps the 60-80 MB model
# out of memory until it speaks. English text to IPA phonemes from CMUdict, without eSpeak.
rten = { version = "0.26", features = ["mmap", "random"] }
rten-tensor = "0.26"
piper-plus-g2p = { version = "0.4", default-features = false, features = ["english"] }
# Downloading the voices (as stealth-net's master server client) and checking them.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The check for a Vulkan GPU before Bevy starts, and the window that says there is none
# (src/no_gpu.rs): Bevy's GL fallback can't present to a window.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan"] }
winit = "0.30"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
# Closes the console window of a game started from Explorer (src/win_console.rs); reads the
# FreeTrack head tracking shared memory (src/headtrack.rs); names joysticks (src/hotas.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
] }

[build-dependencies]
# Links the icon, manifest and version (packaging/windows) into stealth-mission-89.exe.
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The browser build (Trunk.toml). Quick to build for now; for a smaller download (about a third
# less) add opt-level = "s", lto = "fat", codegen-units = 1 and set data-wasm-opt="s" in
# web/index.html, at about 15 minutes a build.
[profile.wasm-release]
inherits = "release"
strip = true
