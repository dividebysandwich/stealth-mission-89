# Opens a pull request against microsoft/winget-pkgs for a release, so that
# `winget install Playspoon.StealthMission89` gets the new version.
#
# Called by the release job of build.yml after it publishes a v* tag, and runnable by hand
# (Actions > Publish to winget > Run workflow) to republish a tag. It does nothing until the
# repository variable WINGET_ENABLED is "true", which is set once the package exists in
# winget-pkgs (microsoft/winget-pkgs#473968 adds it); the action can only update an existing package.
#
# Needs the repository secret WINGET_TOKEN: a classic personal access token with the
# public_repo and workflow scopes, of the owner of the winget-pkgs fork (the repository
# owner, see fork-user below).
name: Publish to winget

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (for example v0.8.6)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.8.6)
        type: string
        required: true

permissions:
  contents: read

jobs:
  winget:
    # Forks must not publish updates to the upstream package identifier.
    if: ${{ github.repository == 'dividebysandwich/stealth-mission-89' && vars.WINGET_ENABLED == 'true' }}
    runs-on: windows-latest
    steps:
      # Pinned to a commit of vedantmgoyal9/winget-releaser (it installs and runs Komac).
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: Playspoon.StealthMission89
          # The x64 and arm64 installers; the zip, tar.gz, AppImage and apk are not.
          installers-regex: 'windows-msvc\.msi$'
          release-tag: ${{ inputs.tag }}
          # The winget-pkgs fork the pull request is made from.
          fork-user: dividebysandwich
          token: ${{ secrets.WINGET_TOKEN }}
