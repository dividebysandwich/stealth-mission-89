name: Android

# The Android app (phones and tablets, flown by touch): run by hand from the Actions tab, or
# `gh workflow run android.yml --ref <branch>`. The APK is the artifact, signed with the debug
# key in packaging/android, so each one installs over the last (`adb install -r`).
on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs in the APK (x86_64 for the emulator)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a x86_64
  # TEMPORARY: while the workflow is not on main, workflow_dispatch can't start it.
  push:
    branches: [android]

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner has the SDK (build-tools, platforms) and NDKs; tools/android-apk.sh takes the
      # newest build-tools and platform.
      - name: Build
        id: build
        env:
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          libs=""
          for abi in $ABIS; do
            case $abi in
              arm64-v8a) target=aarch64-linux-android ;;
              x86_64) target=x86_64-linux-android ;;
            esac
            cargo ndk -t "$abi" -P 28 build --release -p stealth-android
            mkdir -p "dist/$abi"
            "$strip" -o "dist/$abi/libstealth_mission_89.so" \
              "target/$target/release/libstealth_mission_89.so"
            libs="$libs $abi=dist/$abi/libstealth_mission_89.so"
          done
          name="stealth-mission-89-${GITHUB_REF_NAME//\//-}-android"
          tools/android-apk.sh "dist/$name.apk" $libs
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging "dist/${{ steps.build.outputs.name }}.apk" | head -20
          unzip -l "dist/${{ steps.build.outputs.name }}.apk" | grep -E "lib/|AndroidManifest|assets/sim/" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}.apk
          if-no-files-found: error
