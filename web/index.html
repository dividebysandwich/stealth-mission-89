  <script>
    // The WebGPU build, else the WebGL2 build in gl/ (this page, marked data-gl, see
    // web/post_build.sh; ?gl asks for it), else neither.
    const status = document.getElementById("status");
    const unsupported = () => {
      document.getElementById("msg").innerHTML = SM89_T("unsupported");
      document.getElementById("progress").hidden = true;
      document.getElementById("links").firstElementChild.hidden = true;
      throw new Error("no WebGPU or WebGL2");
    };
    if (document.documentElement.hasAttribute("data-gl")) {
      if (!document.createElement("canvas").getContext("webgl2")) unsupported();
    } else {
      const gl = () => location.replace("gl/" + location.search);
      if (!navigator.gpu || new URLSearchParams(location.search).has("gl")) gl();
      else navigator.gpu.requestAdapter().then(a => a || gl(), gl);
    }
    // The game's audio starts before the player has touched the page, so the browser keeps it
    // suspended: resume it on the first click or key.
    const contexts = [];
    const Native = window.AudioContext || window.webkitAudioContext;
    if (Native) {
      window.AudioContext = window.webkitAudioContext = class extends Native {
        constructor(...args) { super(...args); contexts.push(this); }
      };
    }
    const resume = () => contexts.forEach(c => c.state === "suspended" && c.resume());
    ["pointerdown", "keydown"].forEach(e => window.addEventListener(e, resume, { capture: true }));
    // The keys and the right mouse button belong to the game.
    const canvas = document.getElementById("sm89");
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("pointerdown", () => canvas.focus());
    // Trunk's loader says when the game is running (also after a failure, see web/loader.js).
    addEventListener("TrunkApplicationStarted", () => {
      if (!("failed" in status.dataset)) status.classList.add("hidden");
    });
  </script>
